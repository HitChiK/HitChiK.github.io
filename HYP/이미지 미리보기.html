<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 미리보기</title>
<style>
  :root{
    --bg:#11131a; --panel:#1a1d27; --panel2:#232735; --line:#2e3344;
    --text:#e7e9f0; --dim:#9aa0b4; --gold:#e3b341; --gold-d:#b9892b;
    --bad:#3a2326; --radius:10px; --minw:90px; --track:calc(25% - 6px);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; font-size:14px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(17,19,26,.95);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:12px 16px;
  }
  h1{font-size:16px; margin:0; display:flex; align-items:center; gap:8px}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .hbar{display:flex; align-items:center; justify-content:space-between; gap:10px;
        margin-bottom:10px; transition:margin-bottom .2s ease}
  .barToggle{
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer;
    white-space:nowrap; flex:0 0 auto;
  }
  .barToggle:hover{border-color:var(--gold-d); color:var(--text)}
  .controls{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end;
    overflow:hidden; max-height:var(--ctrl-h, 1200px);
    transition:max-height .2s ease, opacity .16s ease}
  header.collapsed .hbar{margin-bottom:0}
  header.collapsed .controls{max-height:0; opacity:0; pointer-events:none}
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-size:11px; color:var(--dim); letter-spacing:.04em}
  input[type=text]{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:13px; min-width:80px;
  }
  input:focus{outline:none; border-color:var(--gold-d)}
  .range{display:flex; align-items:center; gap:6px}
  input[type=range]{accent-color:var(--gold)}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer;
  }
  button:hover{border-color:var(--gold-d)}
  button.primary{background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:600}
  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; font-size:13px; cursor:pointer;
  }
  select:hover{border-color:var(--gold-d)}
  select:focus{outline:none; border-color:var(--gold-d)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 4px}
  .chip{
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
    border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; user-select:none;
  }
  .chip:hover{color:var(--text)}
  .chip.active{background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:600}
  .meta{padding:6px 16px; color:var(--dim); font-size:12px}
  .meta code{color:var(--gold); background:var(--panel); padding:1px 6px; border-radius:5px}
  main{padding:8px 16px 60px}
  .grid{display:grid; gap:8px; align-items:start;
    grid-template-columns:repeat(auto-fill,
      minmax(min(100%, max(var(--minw,90px), var(--track,25%))), 1fr));}
  .cell{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; min-height:160px; cursor:pointer;
  }
  .cell img{width:100%; height:auto; display:block; background:#0c0e14}
  @keyframes cellpulse{0%,100%{background:var(--panel)}50%{background:var(--panel2)}}
  .cell:not(.on):not(.missing){animation:cellpulse 1.3s ease-in-out infinite}
  .cell .num{
    position:absolute; left:5px; bottom:5px; font-size:10px; padding:1px 5px;
    background:rgba(0,0,0,.6); border-radius:5px; color:#fff;
  }
  .cell .cap{
    position:absolute; left:0; right:0; bottom:0; padding:6px; font-size:12px; color:#fff;
    text-align:center; background:linear-gradient(transparent, rgba(0,0,0,.78));
  }
  .cell.cover:hover{border-color:var(--gold)}
  .cell.missing{background:var(--bad)}
  .cell.missing img{display:none}
  .cell.missing::after{
    content:"없음"; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#a8606a; font-size:11px;
  }
  .hide-missing .cell.missing{display:none}
  .detailbar{display:flex; align-items:center; gap:12px; margin:4px 0 12px; flex-wrap:wrap}
  .dtitle{font-size:15px}
  .dtitle .badge{font-size:12px; color:var(--dim)}
  .hint{color:var(--dim); font-size:12px; padding:2px 0 8px}
  /* lightbox */
  .lb{position:fixed; inset:0; background:rgba(6,7,11,.9); z-index:50;
      display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px}
  .lb.open{display:flex}
  .lb img{max-width:90vw; max-height:78vh; border-radius:8px}
  .lb .bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:92vw}
  .lb .url{font-size:12px; color:var(--dim); word-break:break-all; max-width:70vw}
  .lb .nav{position:absolute; top:50%; transform:translateY(-50%); font-size:30px;
           padding:6px 16px; background:rgba(0,0,0,.4); cursor:pointer}
  .lb .nav.prev{left:12px} .lb .nav.next{right:12px}
  .lb .close{position:absolute; top:14px; right:18px; font-size:18px; cursor:pointer}
  .empty{color:var(--dim); padding:40px; text-align:center}
</style>
</head>
<body>
<header class="collapsed">
  <div class="hbar">
    <h1><span class="dot"></span> 이미지 미리보기</h1>
    <button id="toggleBar" class="barToggle" type="button" aria-expanded="false" title="설정 바 접기/펼치기">설정 펼치기 ▼</button>
  </div>
  <div class="controls" id="controls">
    <div class="field" style="flex:1 1 340px">
      <label>템플릿 (t) — 캐릭터 · 의상 · 상황 자리</label>
      <input id="t" type="text" placeholder="https://3zam.com/cga/캐릭터/의상/상황.webp">
    </div>
    <div class="field" style="flex:1 1 340px">
      <label>캐릭터 코드 (c) — , (쉼표)로 구분</label>
      <input id="c" type="text" placeholder="ar,as,are,...">
    </div>
    <div class="field">
      <label>의상 (l) — 여러 개는 쉼표 · 없으면 적지마세요</label>
      <input id="l" type="text" style="width:150px" placeholder="예: a,b (없으면 비움)">
    </div>
    <div class="field">
      <label>상황 범위 (s) — 예: 0..20,30..50</label>
      <input id="s" type="text" style="width:170px" placeholder="0..20,30..50">
    </div>
    <div class="field">
      <label>1줄 개수(최대)</label>
      <div class="range"><input id="cols" type="range" min="1" max="8" value="4"></div>
    </div>
    <button id="apply" class="primary">적용</button>
    <button id="toggleMissing">없는 이미지 숨기기</button>
    <button id="share">링크 복사</button>
    <button id="download">HTML 다운로드</button>
    <select id="zipfmt" title="다운로드 형식 선택">
      <option value="orig">원본 그대로</option>
      <option value="webp">WebP 변환</option>
      <option value="png">PNG 변환</option>
    </select>
    <button id="zip">ZIP 다운로드</button>
  </div>
</header>

<div id="chips" class="chips"></div>
<div class="meta" id="meta"></div>

<main id="main"></main>

<div class="lb" id="lb">
  <span class="close" id="lbClose">✕ 닫기</span>
  <span class="nav prev" id="lbPrev">‹</span>
  <span class="nav next" id="lbNext">›</span>
  <img id="lbImg" alt="">
  <div class="bar">
    <span class="url" id="lbUrl"></span>
    <button id="lbCopy">URL 복사</button>
    <button id="lbOpen">새 탭에서 열기</button>
  </div>
</div>

<script nonce="MTE0OTQwNjA3OCw4MzU2NDM5NjA=">
/* ---------- 기본값 (URL 파라미터 없을 때) ---------- */
const DEFAULTS = { t:"", c:"", l:"", s:"", n:"4", hm:"0", f:"orig" };

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const get = k => qs.get(k) ?? DEFAULTS[k];

let state = { t:get("t"), c:get("c"), l:get("l"), s:get("s"),
              n:get("n"), hm:get("hm"), f:get("f"),
              sel:null, all:true, detail:null };

/* ---------- 파싱 ---------- */
function parseChars(str){ return str.split(/[,~]/).map(x=>x.trim()).filter(Boolean); }
function parseCostumes(){ const l=parseChars(state.l); return l.length?l:[""]; }   // 비었으면 '의상 없음'
function parseRanges(str){
  const out=[];
  str.split(/[,~]/).forEach(part=>{
    part=part.trim(); if(!part) return;
    if(part.includes("..")){
      const [a,b]=part.split("..");
      const pad=a.length;                       // 시작값 자릿수만큼만 0 채움
      for(let i=+a;i<=+b;i++) out.push(String(i).padStart(pad,"0"));
    }else{
      out.push(part);                           // 단일 숫자는 입력 그대로
    }
  });
  return out;
}
function buildUrl(char, cos, sit){
  let t = state.t;
  if((char||"").trim()===""){
    t = t.split("캐릭터/").join("").split("/캐릭터").join("").split("캐릭터").join("");   // // 방지
  }else{
    t = t.split("캐릭터").join(char);
  }
  if((cos||"").trim()===""){
    t = t.split("의상/").join("").split("/의상").join("").split("의상").join("");   // // 방지
  }else{
    t = t.split("의상").join(cos);
  }
  return t.split("상황").join(sit);
}

/* ---------- 캐릭터 칩 ---------- */
function renderChips(){
  const chars=parseChars(state.c);
  const box=$("chips"); box.innerHTML="";
  if(chars.length===0) return;   // 캐릭터 코드 없으면 칩 없음 (상황만 검색 모드)

  const allChip=document.createElement("div");
  allChip.className="chip"+(state.all?" active":"");
  allChip.textContent="전체 보기";
  allChip.onclick=()=>{ state.all=true; state.sel=null; state.detail=null; renderChips(); render(); };
  box.appendChild(allChip);

  chars.forEach(c=>{
    const chip=document.createElement("div");
    chip.className="chip"+(!state.all&&state.sel===c?" active":"");
    chip.textContent=c;
    chip.onclick=()=>{ state.all=false; state.sel=c; state.detail=null; renderChips(); render(); };
    box.appendChild(chip);
  });
  if(!state.sel && !state.all) state.sel=chars[0];
}

/* ---------- 이미지 지연 로딩 (셀이 화면 250px 이내일 때만 로드) ---------- */
let imgIO=null;
function newImgObserver(){
  if(imgIO) imgIO.disconnect();
  imgIO=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const img=en.target;
        if(img.dataset.src){ img.src=img.dataset.src; delete img.dataset.src; }
        imgIO.unobserve(img);
      }
    });
  },{rootMargin:"250px"});
}
function lazyImg(cell, url, alt){
  const img=document.createElement("img");
  img.decoding="async"; img.alt=alt||"";
  img.dataset.src=url;
  img.onerror=()=>cell.classList.add("missing");
  img.onload=()=>cell.classList.add("on");
  imgIO.observe(img);
  return img;
}
/* 후보 URL을 순서대로 시도 — 그 의상에 '실제로 존재하는 첫 이미지'를 커버로 사용 */
function lazyImgList(cell, urls, alt){
  const img=document.createElement("img");
  img.decoding="async"; img.alt=alt||"";
  let i=0;
  img.dataset.src=urls[i++] || "";          // 첫 후보는 관찰자가 로드
  img.onload=()=>cell.classList.add("on");
  img.onerror=()=>{
    if(i<urls.length) img.src=urls[i++];     // 없으면 다음 상황으로 폴백
    else cell.classList.add("missing");
  };
  imgIO.observe(img);
  return img;
}

/* ---------- 상세: 한 캐릭터×의상의 상황 전체 ---------- */
function makeGrid(char, cos, sits){
  const grid=document.createElement("div"); grid.className="grid";
  sits.forEach(sit=>{
    const cell=document.createElement("div"); cell.className="cell";
    cell.appendChild(lazyImg(cell, buildUrl(char,cos,sit), char+"/"+cos+"/"+sit));
    const num=document.createElement("span"); num.className="num"; num.textContent=sit;
    cell.appendChild(num);
    cell.onclick=()=>openLightbox(char,cos,sit);
    grid.appendChild(cell);
  });
  return grid;
}

/* ---------- 렌더 ---------- */
function render(){
  const main=$("main"); main.innerHTML="";
  newImgObserver();
  const sits=parseRanges(state.s);
  const chars=parseChars(state.c);
  const costumes=parseCostumes();

  // 상세 화면
  if(state.detail){
    const {char,cos}=state.detail;
    const bar=document.createElement("div"); bar.className="detailbar";
    const back=document.createElement("button"); back.textContent="← 뒤로";
    back.onclick=()=>{ state.detail=null; render(); scrollTo(0,0); };
    const title=document.createElement("span"); title.className="dtitle";
    title.innerHTML=`${char}${cos?` · 의상 ${cos}`:""} <span class="badge">· ${sits.length}컷</span>`;
    bar.appendChild(back); bar.appendChild(title);
    main.appendChild(bar);
    if(sits.length===0){ main.insertAdjacentHTML("beforeend",'<div class="empty">상황 범위가 비어 있습니다.</div>'); }
    else main.appendChild(makeGrid(char,cos,sits));
    renderMeta(); return;
  }

  // 캐릭터 코드 없이 '상황 코드만'으로 검색 → 의상별 상황 격자를 바로 표시
  if(chars.length===0){
    if(!state.t.trim() || sits.length===0){
      main.innerHTML='<div class="empty">템플릿과 상황 범위를 입력하고 [적용]을 누르세요.</div>'; renderMeta(); return;
    }
    costumes.forEach(cos=>{
      if(costumes.length>1 || (cos&&cos.trim())){          // 의상이 여러 개거나 이름 있으면 헤더
        const bar=document.createElement("div"); bar.className="detailbar";
        const title=document.createElement("span"); title.className="dtitle";
        title.innerHTML=`${cos?("의상 "+cos):"전체"} <span class="badge">· ${sits.length}컷</span>`;
        bar.appendChild(title); main.appendChild(bar);
      }
      main.appendChild(makeGrid("", cos, sits));
    });
    renderMeta(); return;
  }

  // 커버 화면: 캐릭터(×의상)마다 대표 이미지(첫 상황) 1장
  const charList = state.all ? chars : [state.sel].filter(Boolean);
  if(charList.length===0){
    main.innerHTML='<div class="empty">캐릭터 코드를 입력하고 [적용]을 누르세요.</div>'; renderMeta(); return;
  }
  main.insertAdjacentHTML("beforeend",'<div class="hint">카드를 누르면 그 캐릭터의 상황 전체를 불러옵니다.</div>');
  const grid=document.createElement("div"); grid.className="grid";
  charList.forEach(char=>{
    costumes.forEach(cos=>{
      const cell=document.createElement("div"); cell.className="cell cover";
      // 첫 상황이 비어 있어도, 범위 안에서 실제 존재하는 첫 이미지를 대표로 표시
      const candidates = (sits.length?sits:[""]).map(s=>buildUrl(char,cos,s));
      cell.appendChild(lazyImgList(cell, candidates, char));
      const cap=document.createElement("div"); cap.className="cap";
      cap.textContent=char+(cos?(" · 의상 "+cos):"");
      cell.appendChild(cap);
      cell.onclick=()=>{ state.detail={char,cos}; render(); scrollTo(0,0); };
      grid.appendChild(cell);
    });
  });
  main.appendChild(grid);
  renderMeta();
}

function renderMeta(){
  const chars=parseChars(state.c), sits=parseRanges(state.s), costumes=parseCostumes();
  if(!state.t.trim() && chars.length===0 && sits.length===0){
    $("meta").innerHTML="위의 템플릿 · 캐릭터 코드 · 상황 범위를 채우고 <b>적용</b>을 누르세요.";
    return;
  }
  const hasCos = state.t.includes("의상") && state.l.trim()!=="";
  const cosMeta = hasCos ? `의상 <b>${costumes.length}</b> · ` : "";
  $("meta").innerHTML=
    `캐릭터 <b>${chars.length}</b> · 상황 <b>${sits.length}</b> · ${cosMeta}`+
    `예시 <code>${buildUrl(chars[0]||"",costumes[0]||"",sits[0]||"00")}</code>`;
}

/* ---------- 라이트박스 ---------- */
let lbList=[], lbIdx=0;
function openLightbox(char,cos,sit){
  lbList=parseRanges(state.s).map(s=>({char,cos,sit:s}));
  lbIdx=lbList.findIndex(x=>x.sit===sit);
  showLb(); $("lb").classList.add("open");
}
function showLb(){
  const {char,cos,sit}=lbList[lbIdx];
  const url=buildUrl(char,cos,sit);
  $("lbImg").src=url; $("lbUrl").textContent=url;
  $("lbOpen").onclick=()=>window.open(url,"_blank");
  $("lbCopy").onclick=()=>navigator.clipboard.writeText(url);
}
$("lbPrev").onclick=()=>{ lbIdx=(lbIdx-1+lbList.length)%lbList.length; showLb(); };
$("lbNext").onclick=()=>{ lbIdx=(lbIdx+1)%lbList.length; showLb(); };
$("lbClose").onclick=()=>$("lb").classList.remove("open");
$("lb").onclick=e=>{ if(e.target===$("lb")) $("lb").classList.remove("open"); };
document.addEventListener("keydown",e=>{
  if(!$("lb").classList.contains("open")) return;
  if(e.key==="Escape") $("lb").classList.remove("open");
  if(e.key==="ArrowLeft") $("lbPrev").click();
  if(e.key==="ArrowRight") $("lbNext").click();
});

/* ---------- 컨트롤 ---------- */
function syncInputs(){ $("t").value=state.t; $("c").value=state.c; $("l").value=state.l; $("s").value=state.s; }
$("apply").onclick=()=>{
  state.t=$("t").value.trim(); state.c=$("c").value.trim();
  state.l=$("l").value.trim(); state.s=$("s").value.trim();
  state.sel=null; state.detail=null; renderChips(); render();
};
function setCols(n){
  n=Math.max(1, parseInt(n,10)||4);
  state.n=String(n);
  const gap=8;
  document.documentElement.style.setProperty("--track", `calc(${100/n}% - ${(n-1)*gap/n}px)`);
}
$("cols").oninput=e=>setCols(e.target.value);
function setHideMissing(on){
  state.hm = on ? "1" : "0";
  document.body.classList.toggle("hide-missing", on);
  $("toggleMissing").textContent = on ? "없는 이미지 보이기" : "없는 이미지 숨기기";
}
$("toggleMissing").onclick=()=>setHideMissing(state.hm!=="1");
$("zipfmt").onchange=e=>state.f=e.target.value;
$("share").onclick=function(){
  const p=new URLSearchParams({t:state.t,c:state.c,l:state.l,s:state.s});
  if(state.n!==DEFAULTS.n)  p.set("n", state.n);
  if(state.hm==="1")        p.set("hm","1");
  if(state.f!==DEFAULTS.f)  p.set("f", state.f);
  navigator.clipboard.writeText(location.origin+location.pathname+"?"+p.toString());
  const old=this.textContent; this.textContent="복사됨!"; setTimeout(()=>this.textContent=old,1200);
};

/* ---------- 도구 통째로 다운로드 (현재 설정 내장) ---------- */
$("download").onclick=async function(){
  const btn=this, old=btn.textContent;
  let src;
  try{ src = await (await fetch(location.href.split("#")[0].split("?")[0])).text(); }
  catch(e){ alert("도구 소스를 읽지 못했어요.\n3zam.com에 올린 상태(http)에서 실행하세요."); return; }
  const q = s => String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"');
  const line = `const DEFAULTS = { t:"${q(state.t)}", c:"${q(state.c)}", l:"${q(state.l)}", s:"${q(state.s)}", n:"${q(state.n)}", hm:"${q(state.hm)}", f:"${q(state.f)}" };`;
  if(!/const DEFAULTS = \{[^}]*\};/.test(src)){ alert("내장 위치를 찾지 못했어요."); return; }
  src = src.replace(/const DEFAULTS = \{[^}]*\};/, ()=>line);
  const blob=new Blob([src],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="preview.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  btn.textContent="다운로드됨!"; setTimeout(()=>btn.textContent=old,1400);
};

/* ---------- ZIP(STORE/무압축) 작성기 — 외부 라이브러리 없이 직접 생성 ---------- */
const CRC_TABLE=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function buildZip(files){            // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(), chunks=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    const lhU8=new Uint8Array(lh.buffer);
    chunks.push(lhU8,name,f.data);
    central.push({name,crc,size,offset});
    offset+=lhU8.length+name.length+size;
  });
  const cdStart=offset;
  central.forEach(c=>{
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,c.crc,true); ch.setUint32(20,c.size,true); ch.setUint32(24,c.size,true);
    ch.setUint16(28,c.name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,c.offset,true);
    const chU8=new Uint8Array(ch.buffer);
    chunks.push(chU8,c.name); offset+=chU8.length+c.name.length;
  });
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,central.length,true); eo.setUint16(10,central.length,true);
  eo.setUint32(12,offset-cdStart,true); eo.setUint32(16,cdStart,true); eo.setUint16(20,0,true);
  chunks.push(new Uint8Array(eo.buffer));
  return new Blob(chunks,{type:"application/zip"});
}

/* ---------- 이미지 포맷 변환 (canvas 디코딩 → 재인코딩) ---------- */
function convertImage(buf, mime, quality){
  return new Promise((resolve,reject)=>{
    const blobUrl=URL.createObjectURL(new Blob([buf]));
    const im=new Image();
    im.onload=()=>{
      try{
        const c=document.createElement("canvas");
        c.width=im.naturalWidth; c.height=im.naturalHeight;
        c.getContext("2d").drawImage(im,0,0);
        c.toBlob(async b=>{
          URL.revokeObjectURL(blobUrl);
          if(!b){ reject(new Error("encode")); return; }
          resolve(new Uint8Array(await b.arrayBuffer()));
        }, mime, quality);
      }catch(e){ URL.revokeObjectURL(blobUrl); reject(e); }
    };
    im.onerror=()=>{ URL.revokeObjectURL(blobUrl); reject(new Error("decode")); };
    im.src=blobUrl;
  });
}

/* ---------- 검색 결과를 캐릭터/의상 폴더로 묶어 ZIP 다운로드 ---------- */
$("zip").onclick=async function(){
  const btn=this, old=btn.textContent;
  const chars=parseChars(state.c), costumes=parseCostumes(), sits=parseRanges(state.s);
  if(!state.t.trim() || sits.length===0){
    alert("템플릿과 상황 범위를 먼저 채우고 [적용]을 누르세요."); return;
  }
  // 전체 보기면 모든 캐릭터, 특정 캐릭터 선택 중이면 그 캐릭터만, 캐릭터 없으면 '상황만'
  const targetChars = chars.length ? (state.all ? chars : [state.sel].filter(Boolean)) : [""];
  const safe = s => String(s).replace(/[\\/:*?"<>|]/g,"_").trim();   // 폴더/파일명 안전 처리

  const fmt = $("zipfmt").value;                                     // orig | webp | png
  const MIME = {webp:"image/webp", png:"image/png"};
  const EXT  = {webp:".webp",      png:".png"};
  const outMime = MIME[fmt] || null;
  const outExt  = EXT[fmt]  || null;

  const jobs=[];
  targetChars.forEach(char=>costumes.forEach(cos=>sits.forEach(sit=>{
    jobs.push({char,cos,sit,url:buildUrl(char,cos,sit)});
  })));

  btn.disabled=true;
  let done=0, ok=0, fail=0, cvErr=0; const files=[];
  const verb = fmt==="orig" ? "내려받는 중" : "변환 중";
  const label=()=>btn.textContent=`${verb} ${done}/${jobs.length} · 성공 ${ok}`;
  label();

  let idx=0; const CONC=8;
  async function worker(){
    while(idx<jobs.length){
      const j=jobs[idx++];
      try{
        const res=await fetch(j.url);
        const ct=res.headers.get("content-type")||"";
        if(res.ok && !/text\/html/i.test(ct)){           // 404·HTML 에러 페이지 제외
          const buf=new Uint8Array(await res.arrayBuffer());
          if(buf.length){
            const fname=decodeURIComponent(j.url.split(/[?#]/)[0].split("/").pop());
            const parts=[]; if(j.char&&j.char.trim()) parts.push(safe(j.char)); if(j.cos&&j.cos.trim()) parts.push(safe(j.cos));
            const folder=parts.join("/");
            let outBuf=buf, outName=fname;
            if(outMime){                                  // webp·png 변환
              try{
                outBuf  = await convertImage(buf, outMime, fmt==="webp"?0.92:undefined);
                outName = fname.replace(/\.[^.]+$/,"") + outExt;
              }catch(e){ cvErr++; }                        // 변환 실패 → 원본 그대로 보관
            }
            files.push({name:(folder?folder+"/":"")+safe(outName), data:outBuf});
            ok++;
          } else fail++;
        } else fail++;
      }catch(e){ fail++; }
      done++; label();
    }
  }
  await Promise.all(Array.from({length:CONC},worker));

  if(files.length===0){
    alert("내려받은 이미지가 없습니다.\n· 모두 '없음'이거나\n· file:// 로컬 실행으로 차단됐을 수 있어요. 3zam.com에 올린 상태에서 실행하세요.");
    btn.disabled=false; btn.textContent=old; return;
  }
  btn.textContent="압축 중…";
  const blob=buildZip(files);
  const base=((targetChars.length===1&&safe(targetChars[0]))?safe(targetChars[0]):"assets")+(fmt!=="orig"?("_"+fmt):"");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=base+".zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  btn.disabled=false;
  btn.textContent=`완료 ${ok}장${fail?` · 없음 ${fail}`:""}${cvErr?` · 변환실패 ${cvErr}`:""}`;
  setTimeout(()=>btn.textContent=old,2600);
};

/* ---------- 상단 설정 바 접기/펼치기 ---------- */
(function(){
  const header   = document.querySelector("header");
  const controls = $("controls");
  const btn      = $("toggleBar");
  if(!header || !controls || !btn) return;

  const TOP   = 60;     // 스크롤 최상단 근처에서는 항상 펼침
  const DELTA = 12;     // 이만큼 움직여야 방향으로 인정(클수록 둔감 — 진동과는 무관)
  let collapsed = true;   // 시작 시 접힌 상태 (header에 collapsed 클래스로 미리 적용됨)
  let refY      = window.scrollY;   // 방향 판정 기준점
  let locked    = false;            // 접힘/펼침 애니메이션 동안 스크롤 판정을 멈춤
  let fallbackT = 0;                // transitionend가 안 올 때 대비한 보조 타이머

  // 펼친 높이를 정확히 측정해서 부드럽게 여닫게 함(시작 시엔 애니메이션 없이 적용)
  function measure(){
    const t = controls.style.transition;
    controls.style.transition = "none";
    controls.style.setProperty("--ctrl-h", (controls.scrollHeight + 8) + "px");
    void controls.offsetHeight;                       // 강제 reflow
    controls.style.transition = t;
  }

  function endLock(){            // 애니메이션 종료 → 잠금 해제 + 기준점을 정착 위치로 재동기화
    locked = false;
    clearTimeout(fallbackT);
    refY = window.scrollY;
  }
  function setCollapsed(v){
    if(v === collapsed) return;
    collapsed = v;
    header.classList.toggle("collapsed", v);
    btn.setAttribute("aria-expanded", String(!v));
    btn.textContent = v ? "설정 펼치기 ▼" : "설정 접기 ▲";
    // 접고 펴는 동안(애니메이션) 문서 높이가 계속 바뀌고, 그때마다 브라우저가 스크롤을
    // 자동 보정(앵커링)하며 scroll 이벤트를 쏟아낸다. 이를 '사용자 스크롤'로 오인하면
    // 진동이 생기므로, 애니메이션이 '실제로 끝날 때까지'(transitionend) 판정을 잠근다.
    locked = true;
    clearTimeout(fallbackT);
    fallbackT = setTimeout(endLock, 350);   // 혹시 transitionend가 안 오면 대비
  }
  // max-height 트랜지션이 끝나면(=앵커링도 끝남) 잠금 해제
  controls.addEventListener("transitionend", e=>{ if(e.propertyName==="max-height") endLock(); });

  // 아래로 내리면 접고, 맨 위로 오면 펼친다 (중간에서 위로 올리는 것만으론 펼치지 않음)
  function onScroll(){
    const y = Math.max(0, window.scrollY);
    if(locked){ refY = y; return; }                        // 애니메이션/보정 중엔 기준점만 갱신
    if(y <= TOP){ if(y < refY) setCollapsed(false); refY = y; return; }  // '위로 스크롤해' 맨 위에 닿았을 때만 펼침 (시작 접힘 유지)
    if(y < refY){ refY = y; return; }                      // 위로 스크롤은 그대로(펼치지 않고 기준점만 따라감)
    if(y - refY > DELTA){ refY = y; setCollapsed(true); }   // 아래로 충분히 내리면 접힘
  }
  window.addEventListener("scroll", onScroll, {passive:true});

  let rt;
  window.addEventListener("resize", ()=>{
    clearTimeout(rt);
    rt = setTimeout(measure, 150);
  });

  // 수동 토글 버튼(접힘/펼침 즉시 전환)
  btn.onclick = ()=> setCollapsed(!collapsed);

  measure();
})();

/* ---------- 시작 ---------- */
syncInputs();
$("cols").value=state.n; setCols(state.n);
setHideMissing(state.hm==="1");
if(["orig","webp","png"].includes(state.f)) $("zipfmt").value=state.f; else state.f=DEFAULTS.f;
renderChips(); render();
</script>
